# Local and fresh environments must match production: email/password users do
# not receive a session until they confirm the email address used at signup.
[auth.email]
enable_signup = true
enable_confirmations = true

[functions.process-email-queue]
verify_jwt = true

[functions.send-transactional-email]
verify_jwt = true

[functions.preview-transactional-email]
verify_jwt = false

[functions.handle-email-unsubscribe]
verify_jwt = false

[functions.handle-email-suppression]
verify_jwt = false

[functions.notify-admin-signup]
verify_jwt = true

[functions.admin-send-message]
verify_jwt = true

[functions.send-representation-invite]
verify_jwt = true

[functions.run-representation-e2e]
verify_jwt = true

[functions.twilio-status-callback]
verify_jwt = false

# Avatars are read exclusively through short-lived signed URLs. This bucket must
# never be public: a public bucket bypasses storage.objects retrieval policies.
# Fresh/local environments seed it via `supabase start` / `supabase db reset`.
[storage.buckets.profile-avatars]
public = false
file_size_limit = "5MiB"
allowed_mime_types = ["image/jpeg", "image/png", "image/webp"]
